name: Deploy to GitHub Pages

on:
  # Триггер при каждом пуше в main.
  #
  # Ветка hero-ref-2026-08-09 добавлена временно, чтобы посмотреть новый
  # первый экран на живом сайте. GitHub Pages публикует один сайт, поэтому
  # пуш в эту ветку ЗАМЕНЯЕТ то, что сейчас на проде.
  #
  # Откат: запустить этот процесс вручную из вкладки Actions, выбрав ветку
  # main (Run workflow → Branch: main). Сайт вернётся к версии main
  # примерно за полторы минуты. Строку с веткой убрать при её удалении.
  push:
    branches: [main, hero-ref-2026-08-09]
  # Позволяет запускать вручную из вкладки Actions
  workflow_dispatch:

# Права, нужные для клонирования репозитория и публикации Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v7
      - name: Install, build, and upload your site
        uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
